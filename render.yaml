services:
  - type: web
    name: config-precedence-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: development
      - key: APP_WORKERS
        value: "1"
      - key: APP_DEBUG
        value: "true"
      - key: APP_LOG_LEVEL
        value: warning
